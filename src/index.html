<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>cookapps</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav id="sidebar">
    <button id="nav-mail" class="nav-item" aria-label="受信トレイ" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1 3h6l1-3h5"/></svg>
      <span class="nav-count" aria-hidden="true" hidden></span>
    </button>
    <button id="nav-calendar" class="nav-item" aria-label="カレンダー" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    </button>
    <button id="nav-todo" class="nav-item" aria-label="Todo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>
      <span class="nav-count" aria-hidden="true" hidden></span>
    </button>
    <button id="claude-btn" class="avatar account-btn claude" aria-label="Claude" aria-haspopup="dialog" aria-controls="account-popup" aria-expanded="false" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/></svg>
    </button>
    <button id="nav-settings" class="nav-item" aria-label="設定">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5l1.6 2.6 3-.7.9 2.9 2.9.9-.7 3 2.6 1.6-2.6 1.6.7 3-2.9.9-.9 2.9-3-.7-1.6 2.6-1.6-2.6-3 .7-.9-2.9-2.9-.9.7-3L2.5 12l2.6-1.6-.7-3 2.9-.9.9-2.9 3 .7z"/></svg>
    </button>
    <div id="accounts">
      <div id="account-list"></div>
      <div id="account-popup" role="dialog" aria-label="アカウントの情報" hidden></div>
      <button id="add-account" class="nav-item" aria-label="アカウントを追加">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </nav>
  <div id="content">
    <header id="mail-header">
      <button id="back" class="icon-btn" aria-label="戻る" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
      </button>
      <h1 id="title">受信トレイ</h1>
      <button id="reload" class="icon-btn" aria-label="再読み込み" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>
      </button>
      <button id="thread-slack" class="icon-btn" aria-label="Slack に貼る" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 4L8 20M16 4l-1.5 16M4 9h16.5M3.5 15H20"/></svg>
      </button>
      <button id="thread-todo" class="icon-btn" aria-label="Todo にする" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="14" height="14" rx="3"/><path d="M7 11l2.5 2.5L14 9"/><path d="M19 15v6M16 18h6"/></svg>
      </button>
      <button id="trash" class="icon-btn" aria-label="ゴミ箱へ移動" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v6M14 11v6"/></svg>
      </button>
      <button id="archive" class="icon-btn" aria-label="アーカイブ" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11h14V8"/><path d="M10 12h4"/></svg>
      </button>
    </header>
    <p id="error" hidden></p>
    <main id="main">
      <section id="login" hidden>
        <button id="login-button">Google でログイン</button>
      </section>
      <div id="relogin" hidden></div>
      <div id="threads" hidden>
        <ul id="unread-threads"></ul>
        <h2 id="read-heading"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>既読</h2>
        <ul id="read-threads"></ul>
      </div>
      <section id="thread" hidden>
        <div id="thread-head"><h2 id="thread-subject"></h2><span id="thread-label" class="label">受信トレイ</span></div>
        <div id="messages"></div>
      </section>
    </main>
    <section id="calendar" hidden>
      <div id="cal-bar">
        <h1 id="cal-title"></h1>
        <button id="cal-prev" class="icon-btn" aria-label="前の週">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <button id="cal-today" class="text-btn">今日</button>
        <button id="cal-next" class="icon-btn" aria-label="次の週">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>
      <div id="cal-notice"></div>
      <div id="cal-scroll">
        <div id="cal-top">
          <div id="cal-head" class="cal-row"></div>
          <div id="cal-allday" class="cal-row"></div>
        </div>
        <div id="cal-body"></div>
      </div>
    </section>
    <section id="todo" hidden>
      <aside id="projects"></aside>
      <div id="todo-body">
        <header>
          <button id="todo-back" class="icon-btn" aria-label="戻る" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
          </button>
          <h1 id="todo-title">今日</h1>
          <button id="todo-delete" class="icon-btn" aria-label="削除" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>
          </button>
          <button id="todo-disconnect" class="icon-btn" aria-label="Todoist の接続を解除" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 15l6-6"/><path d="M11 6l1.5-1.5a3.5 3.5 0 0 1 5 5L16 11"/><path d="M13 18l-1.5 1.5a3.5 3.5 0 0 1-5-5L8 13"/></svg>
          </button>
          <button id="todo-reload" class="icon-btn" aria-label="再読み込み">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>
          </button>
        </header>
        <div id="todo-notice"></div>
        <div id="todo-main">
          <form id="todo-token" hidden>
            <p>Todoist の設定の「連携」にある個人 API トークンを入力してください。トークンは OS の資格情報の保管場所（macOS はキーチェーン、Windows は資格情報マネージャー）に保存し、画面には表示しません。</p>
            <p id="todo-token-note"></p>
            <div class="row">
              <input id="todo-token-input" type="password" autocomplete="off" aria-label="Todoist の API トークン" placeholder="API トークン">
              <button class="text-btn">保存</button>
            </div>
          </form>
          <form id="todo-add">
            <input id="todo-add-input" placeholder="タスクを追加（例: 資料を読む 明日 15時）" autocomplete="off">
            <button id="todo-add-button" class="text-btn">追加</button>
            <p id="todo-add-hint" hidden></p>
          </form>
          <div id="todo-pending"></div>
          <div id="todo-list"></div>
          <section id="todo-detail" hidden></section>
        </div>
      </div>
    </section>
    <section id="settings" hidden>
      <h1>設定</h1>
      <section class="card">
        <div class="card-head">
          <h2>
            <span class="logo slack"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 4L8 20M16 4l-1.5 16M4 9h16.5M3.5 15H20"/></svg></span>Slack
          </h2>
          <button id="slack-help" class="icon-btn" data-hint aria-label="Slack の設定方法" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.4"/><path d="M12 17h.01"/></svg>
          </button>
        </div>
        <div id="slack-workspaces"></div>
        <form id="slack-token" class="card-add">
          <input id="slack-token-input" type="password" autocomplete="off" aria-label="Slack の User OAuth Token" placeholder="User OAuth Token（xoxp-…）">
          <button class="text-btn">追加</button>
        </form>
      </section>
      <section class="card">
        <div class="card-head">
          <h2>
            <span class="logo claude"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/></svg></span>Claude
          </h2>
          <button id="claude-recheck" class="icon-btn" aria-label="状態を確かめ直す">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>
          </button>
          <button id="claude-help" class="icon-btn" data-hint aria-label="Claude の設定方法" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.4"/><path d="M12 17h.01"/></svg>
          </button>
        </div>
        <div id="claude-items"></div>
      </section>
    </section>
  </div>
  <script src="vendor/marked.umd.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
