<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>cookup</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav id="sidebar">
    <button class="nav-item" title="受信トレイ" aria-label="受信トレイ" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1 3h6l1-3h5"/></svg>
    </button>
  </nav>
  <div id="content">
    <header>
      <button id="back" class="icon-btn" title="戻る" aria-label="戻る" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
      </button>
      <h1 id="title">受信トレイ</h1>
      <h2 id="thread-subject" hidden></h2>
      <button id="reload" class="icon-btn" title="再読み込み" aria-label="再読み込み" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>
      </button>
      <button id="trash" class="icon-btn" title="ゴミ箱へ移動" aria-label="ゴミ箱へ移動" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v6M14 11v6"/></svg>
      </button>
      <button id="archive" class="icon-btn" title="アーカイブ" aria-label="アーカイブ" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11h14V8"/><path d="M10 12h4"/></svg>
      </button>
    </header>
    <p id="error" hidden></p>
    <main id="main">
      <section id="login" hidden>
        <button id="login-button">Google でログイン</button>
      </section>
      <ul id="threads" hidden></ul>
      <section id="thread" hidden>
        <div id="messages"></div>
      </section>
    </main>
  </div>
  <script src="main.js"></script>
</body>
</html>
