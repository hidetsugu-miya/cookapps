[package]
name = "cookapps"
version = "0.54.5"
edition = "2021"
default-run = "cookapps"

[lib]
name = "cookapps_lib"

# Test-only: the WebDriver server and mock bridge for E2E (e2e/). Never in the default or release build.
[features]
e2e = ["dep:keyring-core", "dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crypto_secretbox = "0.1"
dirs = "7"
emojis = "0.9"
encoding_rs = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
getrandom = "0.4"
hkdf = "0.13"
keyring = "4"
keyring-core = { version = "1", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "query", "multipart"] }
rmcp = { version = "3.8", features = ["server", "transport-io", "macros"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
salsa20 = "0.11"
schemars = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.11"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-wdio = { version = "1.5.1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.5.1", optional = true }
tokio = { version = "1", features = ["net", "io-util", "macros", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
url = "2"
x25519-dalek = "3"

# External images on macOS are fetched through NSURLSession (see `images/macos.rs`). The families of the fonts on the Mac come from CoreText (`fonts.rs`).
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFString"] }
objc2-core-text = { version = "0.3", default-features = false, features = ["std", "CTFontManager"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSData", "NSDate", "NSDictionary", "NSError", "NSHTTPCookieStorage", "NSObject", "NSOperation", "NSString", "NSURL", "NSURLCache", "NSURLCredentialStorage", "NSURLRequest", "NSURLResponse", "NSURLSession"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
ts-rs = "12"

# Debug builds keep line tables for our own crate (backtraces show file:line) and no debug info for dependencies, which makes target/ about a third smaller (#239).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
