[package]
name = "cookup"
version = "0.10.6"
edition = "2021"
default-run = "cookup"

[lib]
name = "cookup_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
encoding_rs = "0.8"
getrandom = "0.4"
keyring = "4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "query"] }
rmcp = { version = "3.8", features = ["server", "transport-io", "macros"] }
schemars = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.11"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["net", "io-util", "macros", "rt", "sync", "time"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
