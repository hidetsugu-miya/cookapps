[package]
name = "cookup"
version = "0.6.2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
encoding_rs = "0.8"
getrandom = "0.4"
keyring = "4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["net", "io-util", "rt", "time"] }
url = "2"
