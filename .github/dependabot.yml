version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    # The Rust side of the wdio Tauri plugin; keep it at the same version as @wdio/tauri-* of npm by hand (Dependabot cannot group across ecosystems).
    groups:
      wdio:
        patterns:
          - tauri-plugin-wdio*
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # The npm wdio packages must move together: a PR that mixes v9 and v10 breaks the types and the E2E.
    groups:
      wdio:
        patterns:
          - webdriverio
          - "@wdio/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The Rust version is pinned by hand in rust-toolchain.toml, mise.toml and CI.
      - dependency-name: dtolnay/rust-toolchain
