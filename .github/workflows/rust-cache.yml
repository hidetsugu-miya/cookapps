name: Rust cache

# Fills the Rust cache that the release run restores (AGENTS.md, CI).
# A tag run reads only its own ref's caches and the default branch's, so the cache is made here, on main.
# It runs when the dependencies or the Rust version change, and twice a week so that GitHub does not evict an unused cache (after 7 days).
# It runs no check and holds no secret.
on:
  push:
    branches: [main]
    paths:
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/rust-cache.yml
      - .github/workflows/release.yml
  schedule:
    - cron: "17 18 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-cache
  cancel-in-progress: false

jobs:
  cache:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The same toolchain and cache settings as the release job, so that the cache key is the same.
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          shared-key: release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The same cargo build as the release job (tauri build runs `cargo build --release --bins --features tauri/custom-protocol` with or without bundling), without the bundle and its signing.
      - name: Build the dependencies
        run: npx tauri build --no-bundle --config '{"bundle":{"createUpdaterArtifacts":true}}'
