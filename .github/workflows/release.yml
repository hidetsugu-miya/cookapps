name: Release

# Only a pushed version tag runs anything: static, unit and E2E checks run on the developer's machine before a push (AGENTS.md, CI).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Release: the signed macOS app and the files the installed app updates itself from (latest.json, read by the updater plugin).
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A tag that is not the version of its commit would publish an app that reports another version.
      - name: Check the tag against the version and main
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          scripts/check-version.sh
          version=$(awk '/^\[/ { in_pkg = ($0 == "[package]") } in_pkg && /^version[[:space:]]*=/ { print; exit }' src-tauri/Cargo.toml | sed -E 's/^[^"]*"([^"]*)".*/\1/')
          test "$TAG" = "v$version"
          # A commit that is not on main must not reach the installed apps through latest.json.
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
          test "$status" = identical || test "$status" = behind
      # The version is in the ref (1.99.1), so the action takes no toolchain input.
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      # The same clean-up as rust-cache.yml: rust-cache hashes `rustc -vV` of every installed toolchain, so one that the runner image brings would split the key.
      - name: Uninstall the toolchains other than the pinned one
        run: |
          active=$(rustup show active-toolchain | cut -d' ' -f1)
          test -n "$active"
          for toolchain in $(rustup toolchain list --quiet | grep -vxF "$active"); do
            rustup toolchain uninstall "$toolchain"
          done
      # Only restores the cache that rust-cache.yml made on main: a tag's own cache cannot be read by the next tag.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          shared-key: release
          prefix-key: v1-rust
          save-if: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # createUpdaterArtifacts is given here, not in tauri.conf.json, so a local build and e2e:build need no signing key.
      - name: Build and sign the app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles app --config '{"bundle":{"createUpdaterArtifacts":true}}'
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          dir=src-tauri/target/release/bundle/macos
          scripts/make-latest-json.sh "$TAG" "$dir/cookapps.app.tar.gz.sig" "$GITHUB_REPOSITORY" > latest.json
          gh release create "$TAG" --title "$TAG" --notes "cookapps $TAG" \
            "$dir/cookapps.app.tar.gz" "$dir/cookapps.app.tar.gz.sig" latest.json
