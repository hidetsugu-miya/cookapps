name: Release

# Only a pushed version tag runs anything: static, unit and E2E checks run on the developer's machine before a push (AGENTS.md, CI).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Release: the signed macOS app and the files the installed app updates itself from (latest.json, read by the updater plugin).
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A tag that is not the version of its commit would publish an app that reports another version.
      - name: Check the tag against the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          scripts/check-version.sh
          version=$(awk '/^\[/ { in_pkg = ($0 == "[package]") } in_pkg && /^version[[:space:]]*=/ { print; exit }' src-tauri/Cargo.toml | sed -E 's/^[^"]*"([^"]*)".*/\1/')
          test "$TAG" = "v$version"
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          toolchain: 1.99.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # createUpdaterArtifacts is given here, not in tauri.conf.json, so a local build and e2e:build need no signing key.
      - name: Build and sign the app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles app --config '{"bundle":{"createUpdaterArtifacts":true}}'
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          dir=src-tauri/target/release/bundle/macos
          scripts/make-latest-json.sh "$TAG" "$dir/cookapps.app.tar.gz.sig" "$GITHUB_REPOSITORY" > latest.json
          gh release create "$TAG" --title "$TAG" --notes "cookapps $TAG" \
            "$dir/cookapps.app.tar.gz" "$dir/cookapps.app.tar.gz.sig" latest.json
