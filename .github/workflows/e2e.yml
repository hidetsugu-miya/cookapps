name: E2E

# Runs E2E on a pull request into main, to measure it on a hosted runner (AGENTS.md, CI; #1021, part 1, #1022).
# It splits the specs over 3 runners (`E2E_SHARD`) and runs 2 or 3 apps at once on each, to measure the time of both (#1022). It is a trial and not yet a condition of the merge: E2E still runs on the developer's machine before a push (`.claude/rules/testing.md`), and no ruleset reads this run.
# It holds no secret, and it reads and writes no cache of `release` (its own `shared-key`), so nothing it builds reaches the signed release.
# README.md, CHANGELOG.md and docs/ are what `release-only-diff.sh` leaves out: no spec reads them (`.claude/rules/testing.md`), so a pull request that changes only them runs no job.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths-ignore:
      - README.md
      - CHANGELOG.md
      - "docs/**"

permissions:
  contents: read

# A newer push to the same pull request makes the older run useless.
concurrency:
  group: e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Neither the job ID nor `name:` may be `e2e` or `review`: the check run of a job takes the job's name, and the ruleset on main requires the statuses `e2e` and `review` (`post-checks.sh`) with no integration named, so a check run of the same name would also have to pass, and a running, failed or cancelled trial would block the merge (GitHub: "If a check and a commit status have the same name, both must pass when that name is required").
  hosted-e2e:
    name: E2E on a hosted runner (trial, apps ${{ matrix.apps }}, shard ${{ matrix.shard }}/3)
    # Six jobs, apps (2 and 3 apps at once on a runner) by shard (the third of the specs a runner takes). The apps are the outer axis, so the three jobs of 2 apps start first. At most three run at once, and one that fails does not cancel the others, so every combination gets measured.
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        apps: [2, 3]
        shard: [1, 2, 3]
    # A pull request from a fork runs no job here: it would spend a macOS runner on code that nobody trusted (`.claude/rules/issues.md`).
    # Only the pull request of the trial runs it (its head ref): the six macOS jobs of each other pull request, Dependabot's included, would pass the five macOS jobs that the plan runs at once and keep `release` and `cache` waiting, because `max-parallel` and `concurrency` count one pull request alone.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/e2e-on-actions'
    runs-on: macos-latest
    # A hung wdio run would hold the runner for the six hours of the default. The one runner with two apps took 11 minutes 4 seconds of wdio for 18 of the 21 specs (#1021), and a build with no cache comes before the specs.
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The same toolchain and toolchain clean-up as release.yml and rust-cache.yml (the ref is the Rust version, 1.100.0): keep the three equal.
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0
      # rust-cache hashes `rustc -vV` of every installed toolchain, so a toolchain that the runner image brings (and updates) would split the key.
      - name: Uninstall the toolchains other than the pinned one
        run: |
          active=$(rustup show active-toolchain | cut -d' ' -f1)
          test -n "$active"
          for toolchain in $(rustup toolchain list --quiet | grep -vxF "$active"); do
            rustup toolchain uninstall "$toolchain"
          done
      # Its own key: the E2E build is a debug build with the `e2e` feature, and the cache of `release` (a release build, restored into the signed app) is never read or written here.
      # Only the pull request of the trial runs this workflow (the `if:` of the job), and one job of the six saves the cache, so that the second run of that pull request shows the time with a cache. A save from every job would compress the same `target` six times, and a save on each pull request would pass the 10 GB limit of the repository's caches and evict the cache of `release` that main made.
      # When the trial ends (#1021), delete its caches (the keys that start with `v1-rust-e2e`, from `gh cache list`) with `gh cache delete {key}`; the way to make it on main is decided in part 2 (#1023).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          shared-key: e2e
          prefix-key: v1-rust
          save-if: ${{ github.head_ref == 'fix/e2e-on-actions' && matrix.shard == 1 && matrix.apps == 2 }}
      # WebdriverIO 10 needs 22.23.4, 24.22.1 or later of 24, or 26.12.1 or later (AGENTS.md, Run); mise.toml (private) pins 24.22.3 on the developer's machine.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The steps of run-e2e.sh without its record: `e2e:build`, then `e2e`. The logs are kept for the artifact, and `pipefail` (the shell of `bash`) keeps the exit code of npm, not of tee.
      - name: Build the app for E2E
        run: |
          mkdir -p e2e-logs
          npm run e2e:build 2>&1 | tee e2e-logs/build.log
      - name: Run E2E
        # The hosted runner has 3 vCPUs and 7 GB, and the six apps of wdio at once stopped the WebView from answering: 9 of 21 specs started in 10 minutes, with 104 script timeouts (run 44434378578). Two apps at once took 11 minutes 4 seconds for 18 of 21 specs (#1021). The next measurement is a third of the specs on each of three runners (`E2E_SHARD`), with 2 apps and with 3: `E2E_MAX_INSTANCES` makes `wdio.conf.ts` start that many apps, not six with some driven.
        env:
          E2E_SHARD: ${{ matrix.shard }}/3
          E2E_MAX_INSTANCES: ${{ matrix.apps }}
        run: npm run e2e 2>&1 | tee e2e-logs/wdio.log
      # `logs/` is where @wdio/tauri-service writes its log files (the default of `outputDir`), so a failure can be followed to the app's own output.
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs-apps${{ matrix.apps }}-shard${{ matrix.shard }}
          path: |
            e2e-logs/
            logs/
          if-no-files-found: ignore
          retention-days: 7
