name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Runs of the same ref go one at a time, so two pushes of one version cannot race to make its tag.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

# One job per layer of checks (static, unit, E2E); no check runs in two jobs.
# A push to main whose version has no tag yet is a release: tag makes the tag after the checks pass, then release runs in the same run.
jobs:
  # Static: nothing runs the app.
  static:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # Keep the version in step with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt
      - name: Check version
        run: scripts/check-version.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check the frontend
        run: npm run build:ts
      - name: Type check the E2E
        run: npm run e2e:check
      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check

  # Unit: Rust only; clippy sits here because it compiles every target, tests included.
  test:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri's build embeds src/, whose js/ is the output of tsc, so the frontend comes before cargo.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Build frontend
        run: |
          npm ci
          npm run build:ts
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        working-directory: src-tauri
        run: cargo test --all-features
      # cargo test writes the types of the Rust structs (ts/bindings/); a committed copy that differs is out of date.
      - name: Check bindings
        run: test -z "$(git status --porcelain ts/bindings)"

  # E2E: the real WebView (WKWebView) with the commands mocked.
  e2e:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the E2E app
        run: npm run e2e:build
      - name: E2E
        run: npm run e2e

  # Tags the commit with the version of Cargo.toml unless that tag exists already (a push that is not a release).
  # A tag pushed with GITHUB_TOKEN starts no workflow, so this run is the only one for the release.
  tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [static, test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    outputs:
      release: ${{ steps.tag.outputs.release }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag the version
        id: tag
        run: |
          version=$(awk '/^\[/ { in_pkg = ($0 == "[package]") } in_pkg && /^version[[:space:]]*=/ { print; exit }' src-tauri/Cargo.toml | sed -E 's/^[^"]*"([^"]*)".*/\1/')
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          echo "release=true" >> "$GITHUB_OUTPUT"

  # Release: the signed macOS app and the files the installed app updates itself from (latest.json, read by the updater plugin).
  release:
    needs: [tag]
    if: needs.tag.outputs.release == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          toolchain: 1.99.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # createUpdaterArtifacts is given here, not in tauri.conf.json, so a local build and e2e:build need no signing key.
      - name: Build and sign the app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles app --config '{"bundle":{"createUpdaterArtifacts":true}}'
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          dir=src-tauri/target/release/bundle/macos
          scripts/make-latest-json.sh "$TAG" "$dir/cookapps.app.tar.gz.sig" "$GITHUB_REPOSITORY" > latest.json
          gh release create "$TAG" --title "$TAG" --notes "cookapps $TAG" \
            "$dir/cookapps.app.tar.gz" "$dir/cookapps.app.tar.gz.sig" latest.json
